<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes barGrow {
      0% { height: 0px; }
      100% { height: 70px; }
    }

    .dynamic-bg-circle { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .flow-path { stroke-dasharray: 12, 12; animation: flowLine 4s linear infinite; }
    .floating-card-1 { animation: floatPill 5s ease-in-out infinite; }
    .floating-card-2 { animation: floatPill 6s ease-in-out infinite 1.5s; }
    .title-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
  </style>

  <!-- Base Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Dynamic Glowing Mesh Background (Subtle Behind Foreground) -->
  <circle cx="1000" cy="80" r="160" fill="url(#glowGrad)" class="dynamic-bg-circle" />
  <circle cx="150" cy="280" r="140" fill="url(#glowGrad)" class="dynamic-bg-circle" style="animation-delay: 2s;" />

  <!-- Animated Decorative Flow Circuit Lines (Background Layer) -->
  <path d="M 50 180 Q 300 40 600 180 T 1150 180" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.3" class="flow-path"/>
  <path d="M 50 200 Q 350 320 700 200 T 1150 140" fill="none" stroke="#10b981" stroke-width="2" opacity="0.25" class="flow-path" style="animation-duration: 6s;"/>

  <!-- Background Decorative Data Cards (Right Side) -->
  <g transform="translate(820, 50)" class="floating-card-1">
    <rect width="320" height="110" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="25" y="40" class="badge-text">⚡ AI RECOVERY AGENT</text>
    <text x="25" y="70" font-family="sans-serif" font-size="22" font-weight="bold" fill="#10b981">+42% Liquidation</text>
    <text x="25" y="92" font-family="sans-serif" font-size="12" fill="#64748b">Automated Omnichannel Dunning</text>
    <circle cx="275" cy="55" r="22" fill="#10b981" fill-opacity="0.15"/>
    <path d="M 267 55 L 273 61 L 285 49" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g transform="translate(780, 185)" class="floating-card-2">
    <rect width="340" height="120" rx="12" fill="url(#cardBg)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="25" y="38" class="badge-text" fill="#a78bfa">📊 RISK &amp; RECOVERY ANALYTICS</text>
    <!-- Mini Bar Chart -->
    <rect x="25" y="85" width="16" height="20" rx="3" fill="#6366f1" opacity="0.6"/>
    <rect x="49" y="72" width="16" height="33" rx="3" fill="#6366f1" opacity="0.8"/>
    <rect x="73" y="58" width="16" height="47" rx="3" fill="#38bdf8"/>
    <rect x="97" y="48" width="16" height="57" rx="3" fill="#10b981"/>
    
    <text x="135" y="70" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff">$3.8B Enterprise</text>
    <text x="135" y="90" font-family="sans-serif" font-size="12" fill="#94a3b8">Global Market Ecosystem</text>
  </g>

  <!-- FOREGROUND TEXT CONTENT (High contrast, clearly visible) -->
  <g transform="translate(60, 0)">
    <!-- Top Pill Category Badge -->
    <g transform="translate(0, 50)">
      <rect width="260" height="32" rx="16" fill="url(#primaryGrad)" filter="url(#shadow)"/>
      <text x="130" y="21" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff" letter-spacing="1">FINTECH &amp; BANKING ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title-text" font-size="40" filter="url(#shadow)">
      Awesome Banking Collections
    </text>
    <text x="0" y="192" class="title-text" font-size="38" fill="url(#primaryGrad)">
      &amp; Debt Management 🏦
    </text>

    <!-- Subtitle -->
    <text x="0" y="240" class="subtitle-text" font-size="17">
      Curated list of SaaS Platforms, Open-Source LMS, &amp; AI Dunning Agents
    </text>

    <text x="0" y="270" class="subtitle-text" font-size="14" fill="#64748b">
      Debt Recovery • Risk Modeling • Delinquency Tracking • FDCPA Compliance
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 295)">
      <rect x="0" y="0" width="115" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="57" y="17" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#38bdf8">💳 Core Banking</text>

      <rect x="125" y="0" width="125" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="187" y="17" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#34d399">🤖 AI Voice/SMS</text>

      <rect x="260" y="0" width="135" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="327" y="17" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fbbf24">📈 Liquidation ML</text>
    </g>
  </g>
</svg>
